  macos:
    runs-on: macos-14  
    strategy:
      matrix:
        python-version: [ "3.11" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install system Cairo (needed for cairosvg)
        run: brew install cairo pango gdk-pixbuf libffi

      - name: Export Homebrew paths so Python can find Cairo
        run: |
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV
          echo "CFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> $GITHUB_ENV
          # Help the dynamic loader find libcairo at runtime
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV
          # Optional: some environments also honor this
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV

      - name: Install PaddlePaddle (macOS special wheel)
        run: pip install paddlepaddle==0.0.0 -f https://www.paddlepaddle.org.cn/whl/mac/cpu/develop.html

      - name: Install Torch (CPU)
        run: pip install torch==2.1.2 torchvision==0.16.2

      - name: Install MolGrapher 
        run: pip install "git+https://github.com/lucas-morin/MolGrapher#egg=molgrapher"

      - name: Run prediction test
        run: |
          python - <<'PY'
          from molgrapher.models.molgrapher_model import MolgrapherModel

          model = MolgModel(conf={"force_no_multiprocessing": True})
          images_or_paths = ["./data/benchmarks/default/images/image_0.png"]
          annotations = model.predict_batch(images_or_paths)
          print("Predictions:", annotations)
          PY