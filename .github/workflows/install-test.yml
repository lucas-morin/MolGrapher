name: Install & Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix: { python-version: ["3.11"] }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Cairo/Pango (MSYS2) and add to PATH
        shell: pwsh
        run: |
          choco install msys2 -y
          $roots = @("C:\tools\msys64","C:\msys64") | Where-Object { Test-Path $_ }
          $msys = $roots[0]
          & "$msys\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm"
          & "$msys\usr\bin\bash.exe" -lc "pacman -S --noconfirm mingw-w64-x86_64-cairo mingw-w64-x86_64-pango wget unzip"
          # DLLs for cairo/pango
          "$msys\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies (use setup-python interpreter explicitly)
        shell: pwsh
        run: |
          $PY = Join-Path $env:PythonLocation 'python.exe'
          & $PY -V
          & $PY -m pip --version
          & $PY -m pip install --upgrade pip
          & $PY -m pip install "numpy==1.26.4"
          & $PY -m pip install torch==2.1.2 torchvision==0.16.2
          & $PY -m pip install opencv-python-headless==4.10.*
          & $PY -m pip install paddlepaddle paddleocr==2.10.0
          & $PY -m pip install "molgrapher @ git+https://github.com/lucas-morin/MolGrapher"

      - name: Reinstall specific Paddle CPU
        shell: pwsh
        run: |
          $PY = Join-Path $env:PythonLocation 'python.exe'
          & $PY -m pip install --upgrade --force-reinstall "paddlepaddle==2.6.0"

      - name: Sanity check imports
        shell: pwsh
        run: |
          $PY = Join-Path $env:PythonLocation 'python.exe'
          & $PY -c "import sys,cv2,torch,paddle; print('python:',sys.executable); print('cv2:',cv2.__version__); print('torch:',torch.__version__); print('paddle:',paddle.__version__)"

      - name: Create prediction test script
        shell: bash
        run: |
          cat > run_predict.py <<'PY'
          import os, sys

          # Paddle CPU workaround in CI
          os.environ["FLAGS_use_mkldnn"] = "0"
          os.environ["OMP_NUM_THREADS"]  = "1"
          os.environ["MKL_NUM_THREADS"]  = "1"

          def strip_usr_bin_from_path():
              path = os.environ.get("PATH", "")
              parts = path.split(";")
              filtered = [p for p in parts if not p.lower().endswith("\\usr\\bin")]
              os.environ["PATH"] = ";".join(filtered)

          def add_dll_dirs_for_mingw64():
              # Keep cairo DLLs discoverable after removing usr\bin
              for p in os.environ.get("PATH","").split(";"):
                  if p.lower().endswith("\\mingw64\\bin"):
                      try:
                          os.add_dll_directory(p)
                      except Exception:
                          pass

          from molgrapher.models.molgrapher_model import MolgrapherModel

          def main():
              # Single-process dataloader to avoid NumPy issues in workers
              model = MolgrapherModel({
                  "force_cpu": True,
                  "force_no_multiprocessing": True,
                  "nb_workers": 0,
                  "persistent_workers": False,
                  "prefetch_factor": None,
                  "remove_captions": False,
              })

              # After any downloads done during init, drop usr\bin
              strip_usr_bin_from_path()
              add_dll_dirs_for_mingw64()

              # NumPy sanity check
              try:
                  import numpy as np
                  _ = np.zeros((1,), dtype=np.float32)
              except Exception as e:
                  print("NumPy import check failed:", repr(e), file=sys.stderr)
                  sys.exit(1)

              images_or_paths = ["./data/benchmarks/default/images/image_0.png"]
              annotations = model.predict_batch(images_or_paths)
              print("Predictions:", annotations)

          if __name__ == "__main__":
              main()
          PY

      - name: Check for cairo DLL on PATH
        shell: pwsh
        run: |
          $paths = $env:PATH -split ';'
          foreach ($p in $paths) {
            if (Test-Path (Join-Path $p 'libcairo-2.dll')) { Write-Host "Found cairo in: $p" }
          }

      - name: Run prediction test (Paddle + MSYS2 safe PATH)
        shell: pwsh
        run: |
          $roots = @("C:\tools\msys64","C:\msys64") | Where-Object { Test-Path $_ }
          $msys = $roots[0]
          # Make tools and cairo DLLs visible at start
          $env:PATH = "$msys\mingw64\bin;$msys\usr\bin;$env:PATH"

          $PY = Join-Path $env:PythonLocation 'python.exe'
          & $PY run_predict.py

