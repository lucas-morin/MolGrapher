name: Install & Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install MolGrapher (Linux with [cpu] extra)
        run: pip install "git+https://github.com/lucas-morin/MolGrapher#egg=molgrapher[cpu]"
      - name: Run prediction test
        run: |
          python - <<'PY'
          from molgrapher.models.molgrapher_model import MolgrapherModel
          model = MolgrapherModel()
          images_or_paths = ["./data/benchmarks/default/images/image_0.png"]
          annotations = model.predict_batch(images_or_paths)
          print("Predictions (CPU):", annotations)
          PY

